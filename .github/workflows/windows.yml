name: Windows

on:
  push:
    branches: [windows-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - name: Build
        run: .\build.ps1
      - name: Self-tests
        timeout-minutes: 10
        run: .\build\windows\Solanum.exe --selftest
