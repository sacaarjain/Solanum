name: Windows

on:
  push:
    branches: [windows-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      SOLANUM_SNAPSHOT_DIR: ${{ github.workspace }}\snapshots
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - name: Build
        run: .\build.ps1
      - name: Self-tests
        timeout-minutes: 10
        run: .\build\windows\Solanum-test.exe --selftest
      - name: ssh server
        if: success() || failure()
        timeout-minutes: 10
        run: |
          # A local user that signs in with a password, and Git's bash as the shell, so it's like a Linux host.
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value 'C:\Program Files\Git\bin\bash.exe' -PropertyType String -Force | Out-Null
          net user solanumtest 'Sol-anum-2026!' /add
          Start-Service sshd
          Get-Service sshd | Format-List Name, Status
          ssh -V
      - name: Window test
        env:
          SOLANUM_TEST_SSH_USER: solanumtest
          SOLANUM_TEST_SSH_PASSWORD: Sol-anum-2026!
        if: success() || failure()
        timeout-minutes: 10
        run: .\build\windows\Solanum-test.exe --window-test
      - name: Input probe
        if: success() || failure()
        timeout-minutes: 5
        run: .\build\windows\Solanum-test.exe --input-probe
      - name: Resize probe
        if: success() || failure()
        timeout-minutes: 5
        run: .\build\windows\Solanum-test.exe --resize-probe
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore
