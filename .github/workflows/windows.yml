name: Windows

on:
  push:
    branches: [windows-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      SOLANUM_SNAPSHOT_DIR: ${{ github.workspace }}\snapshots
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - name: Build
        run: .\build.ps1
      - name: Self-tests
        timeout-minutes: 10
        run: .\build\windows\Solanum-test.exe --selftest
      - name: Window test
        if: success() || failure()
        timeout-minutes: 10
        run: .\build\windows\Solanum-test.exe --window-test
      - name: Input probe
        if: success() || failure()
        timeout-minutes: 5
        run: .\build\windows\Solanum-test.exe --input-probe
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore
